<h2>ビジュアルスタイル・雰囲気の選択</h2>
<p class="subtitle">研究分野や業績を掲載するサイトとして、どのような印象にしたいですか？</p>

<div class="cards">
  <div class="card" data-choice="academic-clean" onclick="toggleSelect(this)">
    <div class="card-image" style="background: #f8f9fa; border: 1px solid #dee2e6; height: 120px; display: flex; flex-direction: column; padding: 10px;">
      <div style="width: 40%; height: 8px; background: #333; margin-bottom: 8px;"></div>
      <div style="width: 100%; height: 4px; background: #ccc; margin-bottom: 4px;"></div>
      <div style="width: 90%; height: 4px; background: #ccc; margin-bottom: 4px;"></div>
      <div style="width: 95%; height: 4px; background: #ccc; margin-bottom: 15px;"></div>
      <div style="display: flex; gap: 5px;">
        <div style="width: 30%; height: 20px; border: 1px solid #333;"></div>
        <div style="width: 30%; height: 20px; border: 1px solid #333;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>Academic Clean</h3>
      <p>白を基調とした、信頼感のある伝統的な研究者スタイル。読みやすさを最優先。</p>
    </div>
  </div>

  <div class="card" data-choice="modern-tech" onclick="toggleSelect(this)">
    <div class="card-image" style="background: #121212; height: 120px; display: flex; flex-direction: column; padding: 10px; color: #fff;">
      <div style="width: 50%; height: 10px; background: #007bff; margin-bottom: 10px;"></div>
      <div style="width: 100%; height: 4px; background: #333; margin-bottom: 4px;"></div>
      <div style="width: 100%; height: 4px; background: #333; margin-bottom: 4px;"></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px;">
        <div style="height: 30px; background: #1e1e1e; border-radius: 4px;"></div>
        <div style="height: 30px; background: #1e1e1e; border-radius: 4px;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>Modern Tech</h3>
      <p>ダークモードや洗練されたフォントを使用。先進的なエンジニア・研究者の印象。</p>
    </div>
  </div>

  <div class="card" data-choice="minimal-minimal" onclick="toggleSelect(this)">
    <div class="card-image" style="background: #fff; height: 120px; display: flex; align-items: center; justify-content: center; padding: 10px;">
      <div style="text-align: center; width: 100%;">
        <div style="width: 20px; height: 20px; background: #000; margin: 0 auto 10px;"></div>
        <div style="width: 60%; height: 2px; background: #eee; margin: 0 auto 4px;"></div>
        <div style="width: 50%; height: 2px; background: #eee; margin: 0 auto;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>Minimalist</h3>
      <p>装飾を極限まで省いたスタイル。情報の密度よりも、空間の美しさと簡潔さを重視。</p>
    </div>
  </div>
</div>

<div class="section">
  <p>※ 研究分野や業績が多岐にわたる場合、情報の整理がしやすいスタイルをお勧めします。</p>
</div>
