<h2>鷹野礼音さんのホームページ作成</h2>
<p class="subtitle">まずは、どのようなサイトにしたいかイメージを固めていきましょう。</p>

<div class="section">
  <h3>主な目的の選択</h3>
  <p>ターミナルで回答いただくか、近いものがあれば以下から選んでみてください。</p>
</div>

<div class="options">
  <div class="option" data-choice="portfolio" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>ポートフォリオ</h3>
      <p>制作物やスキルを視覚的にアピールしたい</p>
    </div>
  </div>
  <div class="option" data-choice="resume" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>オンライン履歴書</h3>
      <p>経歴や学歴、連絡先を簡潔にまとめたい</p>
    </div>
  </div>
  <div class="option" data-choice="blog" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>ブログ / 技術発信</h3>
      <p>学んだことや考えを文章で共有したい</p>
    </div>
  </div>
  <div class="option" data-choice="business-card" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>名刺代わりの1ページ</h3>
      <p>SNSリンクや短いプロフィールのみを載せたい</p>
    </div>
  </div>
</div>
