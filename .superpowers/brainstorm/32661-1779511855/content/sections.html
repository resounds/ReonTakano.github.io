<h2>オンライン履歴書の構成</h2>
<p class="subtitle">履歴書に含めたい項目を選んでください（複数選択可）。</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="profile" onclick="toggleSelect(this)">
    <div class="content">
      <h3>基本プロフィール</h3>
      <p>名前、役職、自己紹介など</p>
    </div>
  </div>
  <div class="option" data-choice="experience" onclick="toggleSelect(this)">
    <div class="content">
      <h3>職務経歴 / 活動実績</h3>
      <p>これまでのキャリアやプロジェクトの履歴</p>
    </div>
  </div>
  <div class="option" data-choice="education" onclick="toggleSelect(this)">
    <div class="content">
      <h3>学歴</h3>
      <p>出身校や学位など</p>
    </div>
  </div>
  <div class="option" data-choice="skills" onclick="toggleSelect(this)">
    <div class="content">
      <h3>スキル / 資格</h3>
      <p>プログラミング言語、ツール、保有資格など</p>
    </div>
  </div>
  <div class="option" data-choice="contact" onclick="toggleSelect(this)">
    <div class="content">
      <h3>連絡先 / SNSリンク</h3>
      <p>メール、GitHub、X(Twitter)など</p>
    </div>
  </div>
  <div class="option" data-choice="projects" onclick="toggleSelect(this)">
    <div class="content">
      <h3>主要なプロジェクト</h3>
      <p>特に強調したい成果物や取り組み</p>
    </div>
  </div>
</div>

<div class="section">
  <p>※ その他に追加したい項目があればターミナルで教えてください。</p>
</div>
